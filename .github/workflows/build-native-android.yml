name: Build BetaMusic Native Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract native project
        run: |
          mkdir native-project
          unzip -q BetaMusic-Native-Android.zip -d native-project
          echo "Contenido del ZIP:"
          find native-project -maxdepth 5 -type f | head -100
          echo "Buscando Gradle Wrapper:"
          find native-project -type f -name gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          GRADLEW="$(find "$GITHUB_WORKSPACE/native-project" -type f -name gradlew | head -1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew en el ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaMusic-Native-APK
          path: native-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
