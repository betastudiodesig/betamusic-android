name: Build BetaMusic Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q BetaMusic-Android-GitHub.zip -d source
          mv source/BetaMusic-Android-GitHub project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        working-directory: project/android-app
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        working-directory: project/android-app
        run: npm run check

      - name: Generate Android project
        working-directory: project/android-app
        run: npx cap add android

      - name: Apply application icons
        run: node project/scripts/prepare-android-native.mjs project/android-app/android

      - name: Synchronize application
        working-directory: project/android-app
        run: npx cap sync android

      - name: Compile APK
        working-directory: project/android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaMusic-Android-APK
          path: project/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
